<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendar horário — Barbearia Thiago Coelho</title>
  <meta name="description" content="Barbearia Thiago Coelho em Sumaré-SP: corte de cabelo, barba, navalha e agendamento online.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand" data-nav>
      <img src="assets/favicon.png" alt="Logo da Barbearia Thiago Coelho">
      <span>Thiago Coelho</span>
    </a>
    <nav class="desktop-nav">
      <a href="index.html" data-nav>Início</a>
      <a href="servicos.html" data-nav>Serviços</a>
      <a href="produtos.html" data-nav>Produtos</a>
      <a href="agendar.html" data-nav>Agendar</a>
      <a href="contato.html" data-nav>Contato</a>
    </nav>
    <a class="btn btn-outline desktop-book" href="agendar.html" data-nav>Agendar</a>
    <button class="menu-button" id="menuButton" aria-label="Abrir menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="mobile-nav" id="mobileNav">
    <a href="index.html" data-nav>Início</a>
    <a href="servicos.html" data-nav>Serviços</a>
    <a href="produtos.html" data-nav>Produtos</a>
    <a href="agendar.html" data-nav>Agendar</a>
    <a href="contato.html" data-nav>Contato</a>
  </nav>
</header>

<main class="page booking-page">
  <div class="container booking-container">
    <section class="booking-top">
      <h1>Agendar</h1>
      <p>Escolha seu serviço, data e horário. R. Geraldo Preto Rodrigues, 396 - Jardim Paulistano, Sumaré - SP, 13174-571</p>
    </section>

    <section id="clientBookingProfile" class="client-booking-profile" hidden>
      <div>
        <p class="eyebrow">Sua conta</p>
        <h2 id="clientBookingName">Cliente</h2>
        <p id="clientBookingPhone" class="client-booking-phone"></p>
      </div>
      <button id="clientLogoutButton" class="btn btn-outline client-logout-button" type="button">Sair</button>
    </section>


    <form id="bookingForm" class="booking-form" hidden>
      <div class="booking-field">
        <label for="servico">Serviço</label>
        <select id="servico" class="booking-input"></select>
      </div>

      <div class="booking-field">
        <label for="data">Data</label>
        <input id="data" class="booking-input booking-date" type="date">
      </div>

      <div class="booking-field">
        <label>Horário</label>
        <div id="timeGrid" class="booking-time-grid"></div>
      </div>

      <div class="booking-field">
        <label for="obs">Observações (opcional)</label>
        <textarea id="obs" class="booking-input booking-textarea" rows="3" placeholder="Alguma preferência para o atendimento?"></textarea>
      </div>

      <p id="bookingStatus" class="status" hidden></p>

      <button id="submitBooking" class="btn btn-gold booking-submit" type="submit">
        Confirmar agendamento
      </button>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/agendar.js"></script>
</body>
</html>
