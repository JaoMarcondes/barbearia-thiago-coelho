<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso do barbeiro — Thiago Coelho</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="staff-body">
  <main class="staff-login-page">
    <section class="staff-login-card">
      <a href="index.html" class="staff-brand" aria-label="Voltar ao site">
        <img src="assets/favicon.png" alt="Logo da Barbearia Thiago Coelho">
      </a>

      <p class="eyebrow">Área restrita</p>
      <h1>Acesso do barbeiro</h1>
      <p class="staff-login-copy">Entre com a conta autorizada para visualizar os agendamentos.</p>

      <form id="staffLoginForm" class="staff-login-form">
        <div class="booking-field">
          <label for="staffEmail">E-mail</label>
          <input id="staffEmail" class="booking-input" type="email" autocomplete="username" required>
        </div>

        <div class="booking-field">
          <label for="staffPassword">Senha</label>
          <input id="staffPassword" class="booking-input" type="password" autocomplete="current-password" minlength="6" required>
        </div>

        <p id="staffLoginStatus" class="status" hidden></p>

        <button id="staffLoginButton" class="btn btn-gold staff-login-button" type="submit">
          Entrar
        </button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/barbeiro-login.js"></script>
</body>
</html>
